<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Control Pedidos NF24</title>
<style>
:root{--bg:#0a0d1a;--card:#141a30;--tx:#f4f6ff;--mu:#9aa3c7;--red:#e53935;--blue:#2a4db5;--am:#ffb300;--ok:#2ecc71;--bd:#26305a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f3f5fc;--card:#fff;--tx:#10152b;--mu:#5a6385;--bd:#d5daee}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--bd)}
header img{width:44px;height:44px;border-radius:50%}header h1{font-size:17px;margin:0;flex:1}header small{display:block;color:var(--mu);font-weight:400;font-size:12px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.btn.r{background:var(--red)}.btn.a{background:var(--am);color:#1a1200}.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.s{padding:7px 10px;font-size:14px}
main{max-width:640px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs .btn{flex:1}.tabs .on{background:var(--red)}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.mic{width:100%;font-size:20px;padding:18px;background:var(--red)}.mic.live{animation:p 1s infinite}@keyframes p{50%{opacity:.55}}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
.row{display:flex;gap:8px}.row>*{flex:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--blue);color:#fff}
.big{font-size:26px;font-weight:800}.ok{color:var(--ok)}.am{color:var(--am)}.red{color:var(--red)}.late{color:var(--red)}
.card.red{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}.card.am{border-color:var(--am)}.card.done{opacity:.8}
.mu{color:var(--mu);font-size:13px}.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ord{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;font-weight:800}
.ord.enviar{background:var(--ok);color:#052}.ord.esperar{background:var(--am);color:#1a1200}.ord.indicacion{background:var(--red);color:#fff}
#alert{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;background:var(--red);color:#fff;border-radius:14px;padding:14px;font-weight:700;display:none;box-shadow:0 8px 30px #0008}
#toast{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:15;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:none}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp div{background:var(--bg);border-radius:12px;padding:10px}.kp b{display:block;font-size:24px}
</style>
