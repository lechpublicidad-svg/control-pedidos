<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Control Pedidos NF24</title>
<style>
:root{color-scheme:light;--bg:#fbf6ef;--card:#fff;--tx:#2e2a33;--mu:#80788a;--bd:#eadfd0;--soft:#f4ebe0;--co:#f26a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:#fff;z-index:5;box-shadow:0 2px 14px rgba(90,55,20,.09)}
header img{width:42px;height:42px;border-radius:50%}header h1{font-size:17px;margin:0;flex:1}header small{display:block;color:var(--mu);font-weight:400;font-size:12px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn{border:0;border-radius:14px;padding:13px 14px;background:var(--co);color:#fff;font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,filter .12s;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.btn:active{transform:scale(.95);filter:brightness(.9)}.btn:disabled{opacity:.5}
.btn.g{background:#fff;color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.s{padding:8px 10px;font-size:13px}
main{max-width:760px;margin:0 auto;padding:12px}
.hero{background:linear-gradient(135deg,#ff6a3d,#ffb347);color:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(242,106,61,.35)}
.hero h2{margin:0 0 8px;font-size:15px}.hk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hk div{background:rgba(255,255,255,.22);border-radius:14px;padding:8px;text-align:center;font-size:12px}.hk b{display:block;font-size:26px}
.hero .btn{background:#fff;color:#d94f1f;width:100%;margin-top:10px;font-size:17px}
.tabs{display:flex;gap:8px;margin-bottom:10px}.tabs .btn{flex:1;background:var(--soft);color:var(--tx);box-shadow:none}.tabs .on{background:var(--tx);color:#fff}
.ct,.kit{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.ct::-webkit-scrollbar,.kit::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:#fff;border-radius:99px;padding:8px 12px;font-weight:700;font-size:14px;position:relative;cursor:pointer}
.chip.on{background:var(--c,var(--co));color:#fff;border-color:transparent}.chip b{margin-left:4px}
.dot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#e5484d;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
#car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;align-items:flex-start;scrollbar-width:none;-webkit-overflow-scrolling:touch}#car::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%;scroll-snap-align:start;min-width:0}.ph{color:#fff;border-radius:14px;padding:10px 14px;font-weight:800;margin-bottom:10px}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 12px rgba(90,55,20,.07)}.card{animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(8px)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.cpb{font-size:28px;font-weight:900;letter-spacing:1px}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px}.nm{font-weight:700;margin-top:2px}.mu{color:var(--mu);font-size:13px}
.tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tm span{background:var(--soft);border-radius:8px;padding:3px 8px;font-size:12px}
.cd{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:10px 12px;border-radius:12px;font-weight:600}.cd b{font-size:24px}
.cd.ok{background:#e2f5ec;color:#14573b}.cd.warn{background:#fff0cf;color:#6b4300}.cd.late{background:#fbd9de;color:#8a1d2e}
.wr{background:#fff0cf;color:#6b4300;border-radius:10px;padding:6px 10px;margin-top:8px;font-size:13px}
.inc{background:#efe8ff;color:#4c2a9a;border-radius:10px;padding:6px 10px;margin-top:6px;font-size:13px}.inc.res{opacity:.6}
.ord{display:inline-block;margin-top:8px;padding:8px 12px;border-radius:10px;font-weight:800}.ord.enviar{background:#cdeedd;color:#14543a}.ord.esperar{background:#fde8b5;color:#6b4300}.ord.indicacion{background:#fbd5da;color:#8a1d2e}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.acts .btn:not(.s){flex:1 1 100%;font-size:16px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
input,select,textarea{width:100%;background:#fffdf9;border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx)}input[type=checkbox]{width:auto}
.row{display:flex;gap:8px}.row>*{flex:1}
#sheet,#modal{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.mc{background:#fff;border-radius:20px;padding:18px;width:100%;max-width:480px;margin:auto}.mc h3{margin:0 0 4px}
#alert{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:40;background:#fff;color:var(--tx);border-radius:16px;padding:14px;display:none;box-shadow:0 10px 40px rgba(0,0,0,.35);border-left:9px solid var(--ac,#14b8a6)}
.at{font-size:18px;font-weight:800;color:var(--ac)}#alert .btn{margin-top:10px;width:100%;background:var(--ac)}
#toast{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:35;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;display:none;box-shadow:0 6px 24px rgba(0,0,0,.2)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kp div{background:var(--soft);border-radius:12px;padding:10px;font-size:13px}.kp b{display:block;font-size:24px}
.hero .btn.s{width:auto;font-size:13px;margin-top:0;flex:1;padding:9px}
@media print{body>*:not(#pr){display:none!important}#pr{display:block!important}}
#pr{display:none;padding:8px;color:#000;background:#fff}#pr table{width:100%;border-collapse:collapse}#pr td,#pr th{border:1px solid #aaa;padding:3px 5px;font-size:11px;text-align:left}#pr h1{font-size:20px}#pr h2{font-size:15px;margin:14px 0 6px}#pr p{font-size:12px}
</style><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script></head><body>

function nums(t){const w=t.split(/\s+/),out=[];let cur=null,last='';const fl=()=>{if(cur!==null){out.push(String(cur));cur=null;last=''}};
for(let i=0;i<w.length;i++){const k=w[i].toLowerCase().replace(/[.,;]$/,''),nx=U[(w[i+1]||'').toLowerCase()];
if(k==='y'&&cur!==null&&last==='T'&&nx>0&&nx<10)continue;
if(k in U){const v=U[k];if(cur!==null&&((last==='T'&&v<10)||last==='H'||last==='M')){cur+=v}else{fl();cur=v}last='U'}
else if(k in T){if(cur!==null&&(last==='H'||last==='M')){cur+=T[k]}else{fl();cur=T[k]}last='T'}
else if(k in Hn){if(cur!==null&&last==='M'){cur+=Hn[k]}else{fl();cur=Hn[k]}last='H'}
else if(k==='mil'){cur=(cur===null?1:cur)*1000;last='M'}
else{fl();out.push(w[i])}}
fl();return out.join(' ')}
function parse(raw){let t=nums(raw.trim()).replace(/([ap])\.?\s?m\.?/gi,'$1m').replace(/c[oó]digo postal\s*/ig,'');
const mer=s=>/pm|tarde|noche/i.test(s||'')?'p':/am|mañana|madrugada/i.test(s||'')?'a':'';
const M='(pm|am|de la (?:mañana|tarde|noche|madrugada))?';
let m,h,mi,mm,hora='';
const rs=[[new RegExp('(?:hora[^\\d]{0,30}|a las\\s+)(\\d{1,2})(?:\\s*(?::|y|con)\\s*(\\d{1,2}))?\\s*'+M,'i'),1,2,3],[new RegExp('(\\d{1,2}):(\\d{2})\\s*'+M,'i'),1,2,3],[/(\d{1,2})(?:\s*y\s*(\d{1,2}))?\s*(pm|am)\b/i,1,2,3]];
for(const [re,a,b,c] of rs){m=t.match(re);if(m){h=+m[a];mi=+(m[b]||0);mm=mer(m[c]);if(mm==='p'&&h<12)h+=12;if(mm==='a'&&h===12)h=0;if(h<=23&&mi<=59){hora=pad(h)+':'+pad(mi);t=t.replace(m[0],' ');break}}}

t=t.replace(/uber ?eats?|uber|just ?eat|glovo|globo/ig,' ').replace(/plataforma|hora de entrada|hora/ig,' ').replace(/\s+/g,' ').replace(/^[\s,.:;-]+|[\s,.:;-]+$/g,'');
return{plat,hora,cp,dir:t,nums:nums(raw)}}

const al=new Set();
function checkAlerts(init){V().forEach(o=>{const s=o.estado;if(FIN.includes(s))return;const n=Date.now(),hl=H(o).length,A=[];
if(s==='recibido'||s==='aguantar')A.push([o.entryMs+ENV*6e4,'env'+hl,'op','⏰ Pedido sin enviar a cocina (5 min cumplidos)',1]);

if(s==='listo')A.push([stT(o,'listo')+LST*6e4,'ls'+hl,'rep','🛵 Pedido listo esperando repartidor',1]);
if(s==='reparto')A.push([stT(o,'reparto')+REP*6e4,'rp'+hl,'rep','🛵 Entrega: 30 min cumplidos',1]);
A.push([vms(o)-PRE*6e4,'pv','pre','⏳ Pedido próximo a vencer (10 min)',0],[vms(o),'ve','ven','🔴 Pedido VENCIDO',1]);
A.forEach(([t,k,kind,msg,rp])=>{if(n<t||(k==='pv'&&n>=vms(o)))return;const key=o.id+k+(rp?Math.floor((n-t)/3e5):0);if(al.has(key))return;al.add(key);if(!init){notify(msg,(o.cp||'')+' · '+(o.nombre||o.dir)+' · vence '+vh(o)+' h',kind);if(role==='op'&&o.enviadoMs)push(NT_J,msg,'CP '+(o.cp||'—')+' · vence '+vh(o)+' h')}});
if(role==='op'&&db){const L=stageInc(o,n,'');if(L.length>(o.inc||[]).length){const key='i'+o.id+L.length;if(!al.has(key)){al.add(key);upd(o.id,{inc:L})}}}})}
